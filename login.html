<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Login — Sign in to the University of Eastern Philippines Student Portal.">
    <title>iUEP | Log In</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-card">
        <!-- Branding -->
        <div class="auth-branding">
            <div class="auth-logo">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px">
                    <path d="M480-120 200-272v-240L40-600l440-240 440 240v320h-80v-276l-80 44v240L480-120Zm0-332 274-148-274-148-274 148 274 148Zm0 241 200-108v-151L480-360 280-470v151l200 108Z"/>
                </svg>
            </div>
            <h1 class="auth-title">iUEP Portal</h1>
            <p class="auth-subtitle">University of Eastern Philippines</p>
        </div>

        <!-- Status Message -->
        <div id="login-message" class="auth-message"></div>

        <!-- Login Form -->
        <form id="login-form" autocomplete="off">
            <div class="auth-form-group">
                <label for="login-stu-id">Student ID</label>
                <input type="text" id="login-stu-id" class="auth-input" placeholder="6-digit Student ID"
                    maxlength="6" inputmode="numeric" pattern="\d{6}" required autofocus>
            </div>

            <div class="auth-form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="auth-input" placeholder="Enter your password"
                    minlength="8" required>
            </div>

            <div class="auth-forgot">
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn-primary" id="login-submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
