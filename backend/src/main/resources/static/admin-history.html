<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Admin — Claimed ID card history with export functionality.">
    <title>iUEP | Admin — Claimed History</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="utils.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>

<body data-page="admin-history">

    <div class="main">
        <div class="content" id="history-content">
            <div class="history-header-row">
                <h1 id="admin-page-heading">Claimed ID History</h1>
                <button class="btn-primary" id="export-excel-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px"
                        fill="currentColor">
                        <path
                            d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
                    </svg>
                    Export to Excel
                </button>
            </div>

            <!-- Filters -->
            <div class="history-filters">
                <div class="admin-form-group">
                    <label for="history-course-filter">Filter by Course</label>
                    <select id="history-course-filter" class="admin-input">
                        <option value="all">All Courses</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label for="history-sort">Sort by</label>
                    <select id="history-sort" class="admin-input">
                        <option value="claimed_desc">Claimed Date (Newest)</option>
                        <option value="claimed_asc">Claimed Date (Oldest)</option>
                        <option value="course_asc">Course (A-Z)</option>
                        <option value="course_desc">Course (Z-A)</option>
                        <option value="name_asc">Name (A-Z)</option>
                        <option value="name_desc">Name (Z-A)</option>
                    </select>
                </div>
                <div class="admin-form-group">
                    <label for="history-search">Search</label>
                    <input type="text" id="history-search" class="admin-input" placeholder="Search by name or ID...">
                </div>
            </div>

            <!-- Summary Stats -->
            <div id="history-summary" class="history-summary">
                <span id="history-total-count">0 records</span>
            </div>

            <!-- History Table -->
            <div class="content-box" id="history-table-wrapper">
                <table id="history-table">
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Year</th>
                            <th>Section</th>
                            <th>Library ID</th>
                            <th>Submitted</th>
                            <th>Claimed</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Rows injected by admin-history.js -->
                    </tbody>
                </table>
                <div id="history-empty-state" class="hidden">
                    <p class="sub-text" style="text-align:center;padding:2rem;">No claimed ID cards found.</p>
                </div>
            </div>

            <!-- Export Options Popover -->
            <div id="export-popover" class="id-form-popover export-popover" popover="manual">
                <div id="id-form-header">
                    <h2>Export Options</h2>
                    <button id="export-close" class="btn-icon" aria-label="Close">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="var(--text-primary)">
                            <path
                                d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                        </svg>
                    </button>
                </div>
                <div class="id-form-body">
                    <p class="sub-text" style="margin-bottom:var(--space-lg);">Choose what to include in the exported
                        Excel file.</p>

                    <div class="admin-form-group">
                        <label for="export-mode">Export</label>
                        <select id="export-mode" class="admin-input">
                            <option value="current">Current View (filtered)</option>
                            <option value="all">All Records</option>
                            <option value="date_range">Custom Date Range</option>
                        </select>
                    </div>

                    <div class="admin-form-group hidden" id="export-course-group" style="margin-top:var(--space-md);">
                        <label for="export-course">Course</label>
                        <select id="export-course" class="admin-input">
                            <option value="all">All Courses</option>
                        </select>
                    </div>

                    <div id="export-date-range-group" class="hidden" style="margin-top:var(--space-md);">
                        <div class="admin-form-row">
                            <div class="admin-form-group">
                                <label for="export-date-from">From</label>
                                <input type="date" id="export-date-from" class="admin-input">
                            </div>
                            <div class="admin-form-group">
                                <label for="export-date-to">To</label>
                                <input type="date" id="export-date-to" class="admin-input">
                            </div>
                        </div>
                    </div>

                    <div class="admin-action-row" style="margin-top:var(--space-xl);">
                        <button id="export-cancel" class="btn-secondary">Cancel</button>
                        <button id="export-confirm" class="btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px"
                                fill="currentColor">
                                <path
                                    d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z" />
                            </svg>
                            Download .xlsx
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- WebSockets -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="ws-client.js"></script>

    <script src="admin-history.js"></script>
    <script src="admin-layout.js"></script>
</body>

</html>
