<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Password Recovery — Reset your University of Eastern Philippines Portal password.">
    <title>iUEP | Reset Password</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-card">
        <!-- Branding -->
        <div class="auth-branding">
            <div class="auth-logo">
                <img src="Figma/iUEP Logo 2 - Transparent.png" alt="iUEP Logo">
            </div>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-subtitle">University of Eastern Philippines</p>
        </div>

        <!-- Status Message -->
        <div id="recovery-message" class="auth-message"></div>

        <!-- Step indicators -->
        <div class="auth-steps" id="recovery-steps">
            <div class="auth-step-dot active">1</div>
            <div class="auth-step-connector"></div>
            <div class="auth-step-dot">2</div>
            <div class="auth-step-connector"></div>
            <div class="auth-step-dot">3</div>
        </div>

        <!-- Scrollable form area -->
        <div class="auth-card-body">

            <form id="recovery-form" autocomplete="off">
                <!-- Step 1: Student ID -->
                <div class="auth-form-group" id="recovery-step-1">
                    <label for="recovery-stu-id">Student ID</label>
                    <input type="text" id="recovery-stu-id" class="auth-input" placeholder="6-digit Student ID"
                        maxlength="6" inputmode="numeric" pattern="\d{6}" required autofocus>
                    <div class="auth-form-actions">
                        <button type="button" class="auth-btn-primary" id="recovery-lookup-btn">Look Up Account</button>
                    </div>
                </div>

                <!-- Step 2: Email Verification -->
                <div class="auth-form-group hidden" id="recovery-step-2">
                    <label for="recovery-email-display">Email on file</label>
                    <input type="text" id="recovery-email-display" class="auth-input" disabled>

                    <div class="auth-form-actions">
                        <button type="button" class="auth-btn-primary" id="recovery-send-code-btn" disabled>Send Verification Code</button>
                    </div>

                    <label for="recovery-otp">Verification Code</label>
                    <input type="text" id="recovery-otp" class="auth-input" placeholder="6-digit code"
                        maxlength="6" inputmode="numeric" disabled>
                    <div class="auth-form-actions">
                        <button type="button" class="auth-btn-primary" id="recovery-verify-otp-btn" disabled>Verify Code</button>
                    </div>
                </div>

                <!-- Step 3: New Password -->
                <div class="auth-form-group hidden" id="recovery-step-3">
                    <label for="recovery-new-pw">New Password</label>
                    <input type="password" id="recovery-new-pw" class="auth-input"
                        placeholder="At least 8 characters" minlength="8" disabled>

                    <label for="recovery-confirm-pw">Confirm Password</label>
                    <input type="password" id="recovery-confirm-pw" class="auth-input"
                        placeholder="Re-enter new password" minlength="8" disabled>

                    <button type="button" class="auth-btn-primary" id="recovery-reset-btn" disabled>Reset Password</button>
                </div>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
    'use strict';

    (function () {
        const DOM = {
            messageEl: document.getElementById('recovery-message'),
            stuIdInput: document.getElementById('recovery-stu-id'),
            lookupBtn: document.getElementById('recovery-lookup-btn'),
            step1: document.getElementById('recovery-step-1'),
            step2: document.getElementById('recovery-step-2'),
            step3: document.getElementById('recovery-step-3'),
            emailDisplay: document.getElementById('recovery-email-display'),
            sendCodeBtn: document.getElementById('recovery-send-code-btn'),
            otpInput: document.getElementById('recovery-otp'),
            verifyOtpBtn: document.getElementById('recovery-verify-otp-btn'),
            newPw: document.getElementById('recovery-new-pw'),
            confirmPw: document.getElementById('recovery-confirm-pw'),
            resetBtn: document.getElementById('recovery-reset-btn'),
            stepDots: document.querySelectorAll('.auth-step-dot'),
            stepConnectors: document.querySelectorAll('.auth-step-connector'),
        };

        let state = { stuId: null };

        function showMsg(text, type = 'error') {
            DOM.messageEl.textContent = text;
            DOM.messageEl.className = `auth-message show ${type}`;
        }
        function hideMsg() {
            DOM.messageEl.className = 'auth-message';
            DOM.messageEl.textContent = '';
        }

        function advanceStep(step) {
            DOM.stepDots.forEach((dot, i) => {
                dot.classList.remove('active', 'completed');
                if (i + 1 < step) { dot.classList.add('completed'); dot.textContent = '✓'; }
                else if (i + 1 === step) { dot.classList.add('active'); }
            });
            DOM.stepConnectors.forEach((c, i) => c.classList.toggle('completed', i + 1 < step));
        }

        // Digits only on student ID
        DOM.stuIdInput.addEventListener('input', () => {
            DOM.stuIdInput.value = DOM.stuIdInput.value.replace(/\D/g, '').slice(0, 6);
        });

        // Step 1: Look up account
        DOM.lookupBtn.addEventListener('click', async () => {
            hideMsg();
            const stuId = DOM.stuIdInput.value.trim();
            if (!/^\d{6}$/.test(stuId)) {
                showMsg('Student ID must be exactly 6 digits.');
                return;
            }

            DOM.lookupBtn.disabled = true;
            DOM.lookupBtn.textContent = 'Looking up...';

            try {
                const res = await fetch('/api/auth/lookup-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stuId }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Lookup failed');

                state.stuId = stuId;

                DOM.stuIdInput.disabled = true;
                DOM.stuIdInput.classList.add('success');
                DOM.lookupBtn.textContent = '✓';

                DOM.emailDisplay.value = data.maskedEmail;
                DOM.step2.classList.remove('hidden');
                DOM.sendCodeBtn.disabled = false;

                advanceStep(2);
                showMsg('Account found. Verify your email to continue.', 'success');
            } catch (err) {
                showMsg(err.message);
                DOM.lookupBtn.disabled = false;
                DOM.lookupBtn.textContent = 'Look Up Account';
            }
        });

        // Step 2: Send OTP
        DOM.sendCodeBtn.addEventListener('click', async () => {
            hideMsg();
            DOM.sendCodeBtn.disabled = true;
            DOM.sendCodeBtn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/auth/send-otp-for-recovery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stuId: state.stuId }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to send code');

                showMsg('Verification code sent to your email!', 'info');
                DOM.sendCodeBtn.textContent = 'Resend';
                DOM.sendCodeBtn.disabled = false;
                DOM.otpInput.disabled = false;
                DOM.verifyOtpBtn.disabled = false;
                DOM.otpInput.focus();
            } catch (err) {
                showMsg(err.message);
                DOM.sendCodeBtn.disabled = false;
                DOM.sendCodeBtn.textContent = 'Send Verification Code';
            }
        });

        // OTP digits only
        DOM.otpInput.addEventListener('input', () => {
            DOM.otpInput.value = DOM.otpInput.value.replace(/\D/g, '').slice(0, 6);
        });

        // Step 2: Verify OTP
        DOM.verifyOtpBtn.addEventListener('click', async () => {
            hideMsg();
            const code = DOM.otpInput.value.trim();
            if (!/^\d{6}$/.test(code)) {
                showMsg('Please enter a 6-digit code.');
                return;
            }

            DOM.verifyOtpBtn.disabled = true;
            DOM.verifyOtpBtn.textContent = 'Verifying...';

            try {
                const res = await fetch('/api/auth/verify-otp-for-recovery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stuId: state.stuId, code }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Verification failed');

                DOM.otpInput.disabled = true;
                DOM.otpInput.classList.add('success');
                DOM.verifyOtpBtn.textContent = '✓';
                DOM.sendCodeBtn.disabled = true;

                DOM.step3.classList.remove('hidden');
                DOM.newPw.disabled = false;
                DOM.confirmPw.disabled = false;
                DOM.resetBtn.disabled = false;
                DOM.newPw.focus();

                advanceStep(3);
                showMsg('Email verified! Set your new password.', 'success');
            } catch (err) {
                showMsg(err.message);
                DOM.verifyOtpBtn.disabled = false;
                DOM.verifyOtpBtn.textContent = 'Verify Code';
            }
        });

        // Step 3: Reset Password
        DOM.resetBtn.addEventListener('click', async () => {
            hideMsg();
            const newPw = DOM.newPw.value;
            const confirmPw = DOM.confirmPw.value;

            if (newPw.length < 8) {
                showMsg('Password must be at least 8 characters.');
                DOM.newPw.focus();
                return;
            }
            if (newPw !== confirmPw) {
                showMsg('Passwords do not match.');
                DOM.confirmPw.focus();
                return;
            }

            DOM.resetBtn.disabled = true;
            DOM.resetBtn.textContent = 'Resetting...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stuId: state.stuId, newPassword: newPw }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Reset failed');

                showMsg('Password reset successful! Redirecting to login...', 'success');
                DOM.newPw.disabled = true;
                DOM.confirmPw.disabled = true;
                DOM.resetBtn.textContent = '✓';

                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
            } catch (err) {
                showMsg(err.message);
                DOM.resetBtn.disabled = false;
                DOM.resetBtn.textContent = 'Reset Password';
            }
        });
    })();
    </script>
</body>

</html>
