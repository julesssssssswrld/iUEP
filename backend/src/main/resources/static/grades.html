<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="iUEP Grades - View your academic grades and course performance at the University of Eastern Philippines.">
    <title>iUEP | Grades</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="utils.js"></script>
</head>

<body data-page="grades">

    <div class="main">
        <!-- Auth Guard: shown when user is not logged in -->
        <div id="grades-auth-guard" class="auth-guard hidden">
            <svg xmlns="http://www.w3.org/2000/svg" height="64px" viewBox="0 -960 960 960" width="64px"
                fill="var(--text-secondary)">
                <path
                    d="M480-120q-138 0-240.5-91.5T122-440h82q14 104 92.5 172T480-200q117 0 198.5-81.5T760-480q0-117-81.5-198.5T480-760q-69 0-129 32t-101 88h110v80H120v-240h80v94q51-64 124.5-99T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Zm112-192L440-464v-216h80v184l128 128-56 56Z" />
            </svg>
            <h2>Login Required</h2>
            <p class="sub-text">Please log in to view your academic grades.</p>
            <a href="login.html" class="btn-primary">Log In</a>
        </div>

        <div class="content" id="grades-content">
            <h1 class="display-user-name">Student</h1>

            <div id="grade-styling-div-top">
                <div id="grade-styling-div-left">
                    <p class="main-text display-stu-id">000000</p>
                </div>
                <div id="grade-styling-div-right">
                    <p class="main-text">As of <span id="currentDateDisplay"></span></p>
                </div>
            </div>

            <div style="margin-bottom: 1rem;">
                <select id="semester-select" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-primary); font-family: inherit; font-size: 0.9rem; cursor: pointer;">
                    <option value="">All Semesters</option>
                </select>
            </div>

            <table id="grades-table">
                <thead>
                    <tr>
                        <th class="code-column">Subject Code</th>
                        <th>Description</th>
                        <th class="grade-column">Grade</th>
                    </tr>
                </thead>
                <tbody id="grades-tbody">
                    <!-- Injected by grades.js -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="grades.js"></script>
    <script src="layout.js"></script>
</body>

</html>
