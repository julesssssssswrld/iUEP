<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Home - University of Eastern Philippines student portal dashboard with campus news and department updates.">
    <title>iUEP | Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="utils.js"></script>
</head>

<body data-page="home">

    <div class="main">
        <div class="content" id="home-content">

            <h1 id="dashboard-heading">Dashboard</h1>

            <div id="home-layout">
                <!-- Feed (left/center) -->
                <div id="home-feed">
                    <div id="recent-updates-container">
                        <!-- Injected by dashboard.js — most recent 10, grouped by date -->
                    </div>
                </div>

                <!-- Department Selector (right sidebar) -->
                <aside id="dept-sidebar">
                    <h3 class="dept-sidebar-heading">Departments</h3>
                    <div id="dept-filter-list">
                        <button class="dept-filter-item active" data-dept="all">All Updates</button>
                        <button class="dept-filter-item" data-dept="upmao">University Publication &amp; Media Affairs</button>
                        <button class="dept-filter-item" data-dept="usc">University Student Council</button>
                        <button class="dept-filter-item" data-dept="pillar">The Pillar</button>
                        <button class="dept-filter-item" data-dept="cs">College of Science</button>
                        <button class="dept-filter-item" data-dept="coe">College of Engineering</button>
                        <button class="dept-filter-item" data-dept="cnahs">CNAHS</button>
                        <button class="dept-filter-item" data-dept="coed">College of Education</button>
                        <button class="dept-filter-item" data-dept="cba">College of Business Admin</button>
                        <button class="dept-filter-item" data-dept="cvm">College of Vet Medicine</button>
                        <button class="dept-filter-item" data-dept="cac">College of Arts &amp; Comm</button>
                        <button class="dept-filter-item" data-dept="ccj">College of Criminal Justice</button>
                        <button class="dept-filter-item" data-dept="col">College of Law</button>
                        <button class="dept-filter-item" data-dept="cafnr">CAFNR</button>
                    </div>
                </aside>
            </div>

        </div>
    </div>

    <script src="dashboard.js"></script>
    <script src="layout.js"></script>
</body>

</html>
