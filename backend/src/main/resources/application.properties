# ===================================================================
# iUEP Spring Boot Configuration
# ===================================================================

server.port=${PORT:3000}
server.address=0.0.0.0

# ── Database (SQLite) ──
spring.datasource.url=jdbc:sqlite:../iuep.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=../uploads

# ── JWT ──
app.jwt.secret=${JWT_SECRET:iUEP-dev-secret-key-change-in-production-min-256-bits-long!!}
app.jwt.expiration-ms=86400000

# ── Email (SMTP) ──
# Defaults target Gmail over STARTTLS (587). For Gmail, use an App Password
# (Google Account > Security > 2-Step Verification > App passwords).
# For implicit SSL on port 465 set: SMTP_PORT=465, SMTP_SSL=true, SMTP_STARTTLS=false
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.mail.from-name=iUEP Connect
app.otp.expiration-minutes=10

# ── Apify (FB Scraper) ──
app.apify.token=${APIFY_TOKEN:}
app.apify.actor-id=apify~facebook-posts-scraper
app.apify.base-url=${APIFY_BASE_URL:https://api.apify.com}

# ── Logging ──
logging.level.com.iuep=INFO
logging.level.org.hibernate.SQL=WARN
