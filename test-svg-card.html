<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG ID Card Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f0f0;
            font-family: Montserrat, sans-serif;
            gap: 40px;
            padding: 40px;
            flex-wrap: wrap;
        }
        .card-container {
            width: 300px;
            aspect-ratio: 54 / 85.6;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .card-container-large {
            width: 500px;
        }
        h3 {
            width: 100%;
            text-align: center;
            margin-bottom: -20px;
            color: #333;
        }
    </style>
</head>
<body>
    <h3>300px width (default)</h3>
    <div class="card-container" id="card-small"></div>

    <h3>500px width (scaled up)</h3>
    <div class="card-container card-container-large" id="card-large"></div>

    <script src="id-card-svg.js"></script>
    <script>
        // Convert an image to base64 for embedding in SVG
        function loadImageAsBase64(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = () => {
                    console.warn('Could not load image:', src);
                    resolve('');
                };
                img.src = src;
            });
        }

        async function init() {
            // Load the UEP Official Seal
            // Save the UEP seal image as "UEP-Seal.png" in the project root
            const logoBase64 = await loadImageAsBase64('Figma/UEP Logo.png');

            const studentData = {
                studentName: 'JULES IAN C. TOMACAS',
                studentId: '240475',
                course: 'BSIT',
                college: 'COLLEGE OF SCIENCE',
                photoBase64: '', // no photo for demo
                logoBase64: logoBase64,
            };

            renderIdCard(document.getElementById('card-small'), studentData);
            renderIdCard(document.getElementById('card-large'), studentData);
        }

        init();
    </script>
</body>
</html>
