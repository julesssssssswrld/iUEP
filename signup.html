<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Sign Up — Create your University of Eastern Philippines Student Portal account.">
    <title>iUEP | Sign Up</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="auth-card">
        <!-- Branding -->
        <div class="auth-branding">
            <div class="auth-logo">
                <img src="Figma/iUEP Logo 2 - Transparent.png" alt="iUEP Logo">
            </div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">University of Eastern Philippines</p>
        </div>

        <!-- Step Indicators -->
        <div class="auth-steps">
            <div class="auth-step-dot active" data-step="1">1</div>
            <div class="auth-step-connector" data-connector="1"></div>
            <div class="auth-step-dot" data-step="2">2</div>
            <div class="auth-step-connector" data-connector="2"></div>
            <div class="auth-step-dot" data-step="3">3</div>
            <div class="auth-step-connector" data-connector="3"></div>
            <div class="auth-step-dot" data-step="4">4</div>
        </div>

        <!-- Scrollable form area -->
        <div class="auth-card-body">

            <!-- Status Message -->
            <div id="signup-message" class="auth-message"></div>

            <!-- Signup Form (all steps visible, fields disabled until step is reached) -->
            <form id="signup-form" autocomplete="off">

                <!-- ─── Step 1: Student ID Check ─── -->
                <div class="auth-section-label">Step 1 — Student ID Verification</div>
                <div class="auth-form-group">
                    <label for="signup-stu-id">Student ID <span class="required">*</span></label>
                    <div class="auth-input-action">
                        <input type="text" id="signup-stu-id" class="auth-input" placeholder="6-digit Student ID"
                            maxlength="6" inputmode="numeric" pattern="\d{6}" required>
                        <button type="button" id="signup-verify-id-btn" class="btn-verify">Verify</button>
                    </div>
                </div>

                <!-- ─── Step 2: Birthday Verification ─── -->
                <div class="auth-section-label">Step 2 — Identity Verification</div>
                <div class="auth-form-group">
                    <label for="signup-birthday">Date of Birth <span class="required">*</span></label>
                    <div class="auth-input-action">
                        <input type="date" id="signup-birthday" class="auth-input" disabled required>
                        <button type="button" id="signup-verify-bday-btn" class="btn-verify" disabled>Verify</button>
                    </div>
                </div>

                <!-- ─── Step 3: Email Verification (Placeholder) ─── -->
                <div class="auth-section-label">Step 3 — Email Verification</div>
                <div class="auth-form-group">
                    <label>Verification Email</label>
                    <div class="auth-input-action">
                        <input type="text" id="signup-masked-email" class="auth-input" value="" disabled readonly>
                        <button type="button" id="signup-send-code-btn" class="btn-verify" disabled>Send Code</button>
                    </div>
                </div>
                <div class="auth-form-group">
                    <label for="signup-otp">Verification Code <span class="required">*</span></label>
                    <div class="auth-input-action">
                        <input type="text" id="signup-otp" class="auth-input" placeholder="6-digit code"
                            maxlength="6" inputmode="numeric" disabled>
                        <button type="button" id="signup-verify-otp-btn" class="btn-verify" disabled>Confirm</button>
                    </div>
                </div>

                <!-- ─── Step 4: Account Setup ─── -->
                <div class="auth-section-label">Step 4 — Account Setup</div>

                <!-- Auto-filled student info (one field per line) -->
                <div class="auth-form-group">
                    <label>First Name</label>
                    <input type="text" id="signup-first-name" class="auth-input" disabled readonly>
                </div>
                <div class="auth-form-group">
                    <label>Middle Name</label>
                    <input type="text" id="signup-middle-name" class="auth-input" disabled readonly>
                </div>
                <div class="auth-form-group">
                    <label>Last Name</label>
                    <input type="text" id="signup-last-name" class="auth-input" disabled readonly>
                </div>

                <!-- User-editable fields (one per line) -->
                <div class="auth-form-group">
                    <label for="signup-username">Username <span class="required">*</span></label>
                    <input type="text" id="signup-username" class="auth-input" placeholder="Choose a username"
                        minlength="3" disabled required>
                </div>
                <div class="auth-form-group">
                    <label for="signup-password">Password <span class="required">*</span></label>
                    <input type="password" id="signup-password" class="auth-input" placeholder="Min. 8 characters"
                        minlength="8" disabled required>
                </div>
                <div class="auth-form-group">
                    <label for="signup-confirm-pw">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="signup-confirm-pw" class="auth-input" placeholder="Re-enter password"
                        minlength="8" disabled required>
                </div>

                <button type="submit" class="auth-btn-primary" id="signup-submit" disabled>Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
