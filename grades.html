<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Grades - View your academic grades and course performance at the University of Eastern Philippines.">
    <title>iUEP | Grades</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="utils.js"></script>
</head>

<body data-page="grades">

    <div class="main">
        <div class="content" id="grades-content">
            <h1 class="display-user-name">Student</h1>

            <div id="grade-styling-div-top">
                <div id="grade-styling-div-left">
                    <p class="main-text display-stu-id">000000</p>
                </div>
                <div id="grade-styling-div-right">
                    <p class="main-text">As of <span id="currentDateDisplay"></span></p>
                </div>
            </div>

            <table id="grades-table">
                <thead>
                    <tr>
                        <th class="code-column">Subject Code</th>
                        <th>Description</th>
                        <th class="grade-column">Grade</th>
                    </tr>
                </thead>
                <tbody id="grades-tbody">
                    <!-- Injected by grades.js -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="grades.js"></script>
    <script src="layout.js"></script>
</body>

</html>
