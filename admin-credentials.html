<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iUEP Admin — Manage your admin account settings.">
    <title>iUEP | Admin — Account</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="utils.js"></script>
</head>

<body data-page="admin-credentials">

    <div class="main">
        <div class="content" id="credentials-content">
            <h1 id="admin-page-heading">Account Settings</h1>
            <p class="sub-text" style="margin-bottom: var(--space-xl);">Manage your admin login credentials.</p>

            <!-- Change Username -->
            <div class="content-box admin-form-card">
                <h2 class="admin-form-card-title">Change Username</h2>
                <form id="change-username-form" autocomplete="off">
                    <div class="admin-form-group" style="max-width:24rem;">
                        <label for="current-username">Current Username</label>
                        <input type="text" id="current-username" class="admin-input" disabled>
                    </div>
                    <div class="admin-form-group" style="max-width:24rem; margin-top:var(--space-md);">
                        <label for="new-username">New Username</label>
                        <input type="text" id="new-username" class="admin-input" placeholder="Enter new username" required>
                    </div>
                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="save-username-btn">Update Username</button>
                    </div>
                </form>
                <div id="username-message" class="admin-inline-message"></div>
            </div>

            <!-- Change Password -->
            <div class="content-box admin-form-card">
                <h2 class="admin-form-card-title">Change Password</h2>
                <form id="change-password-form" autocomplete="off">
                    <div class="admin-form-group" style="max-width:24rem;">
                        <label for="current-password">Current Password</label>
                        <input type="password" id="current-password" class="admin-input" placeholder="Enter current password" required>
                    </div>
                    <div class="admin-form-group" style="max-width:24rem; margin-top:var(--space-md);">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" class="admin-input" placeholder="Min 6 characters" minlength="6" required>
                    </div>
                    <div class="admin-form-group" style="max-width:24rem; margin-top:var(--space-md);">
                        <label for="confirm-password">Confirm New Password</label>
                        <input type="password" id="confirm-password" class="admin-input" placeholder="Re-enter new password" required>
                    </div>
                    <div class="admin-form-actions">
                        <button type="submit" class="btn-primary" id="save-password-btn">Update Password</button>
                    </div>
                </form>
                <div id="password-message" class="admin-inline-message"></div>
            </div>

        </div>
    </div>

    <script src="admin-credentials.js"></script>
    <script src="admin-layout.js"></script>
</body>

</html>
